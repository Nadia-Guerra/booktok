openapi: 3.1.0
info:
  title: API de Del Libro a la Pantalla
  version: 0.1.0
  description: >-
    Contrato de la API (D-52). Solo describe las rutas ya construidas; la lista completa
    planeada está en endpoints.md.
servers:
  - url: /api/v1
paths:
  /salud:
    get:
      operationId: salud
      summary: Estado de la API y de cada base (EP-01)
      security: []
      responses:
        '200':
          description: >-
            La API responde. Si alguna base no contesta, `estado` es `degradado` y la base aparece
            como `caida`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
              example:
                estado: ok
                api: ok
                bases: { postgres: ok, mongo: ok, neo4j: ok }
  /auth/registro:
    post:
      operationId: registrar
      summary: Registrar un lector (EP-02, O1)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correo, password, nombre]
              properties:
                correo:
                  type: string
                  format: email
                  maxLength: 254
                  description: Se recorta y se pasa a minúsculas.
                password: { type: string, minLength: 8 }
                nombre: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '201':
          description: Cuenta creada.
          content:
            application/json:
              schema:
                type: object
                required: [usuario_id]
                properties:
                  usuario_id: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/EntradaInvalida' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '503': { $ref: '#/components/responses/BaseNoDisponible' }
  /auth/sesion:
    post:
      operationId: iniciarSesion
      summary: Iniciar sesión (EP-03, O2)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correo, password]
              properties:
                correo: { type: string, format: email }
                password: { type: string, minLength: 1 }
      responses:
        '201':
          description: Sesión abierta. El token solo se entrega aquí y vence a los 30 días.
          content:
            application/json:
              schema:
                type: object
                required: [token, expira_en, usuario]
                properties:
                  token: { type: string }
                  expira_en: { type: string, format: date-time }
                  usuario: { $ref: '#/components/schemas/Perfil' }
        '400': { $ref: '#/components/responses/EntradaInvalida' }
        '401':
          description: El correo o la contraseña no coinciden (la respuesta es la misma en ambos casos).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/BaseNoDisponible' }
    delete:
      operationId: cerrarSesion
      summary: Cerrar la sesión actual (EP-04, O23)
      security: [{ sesion: [] }]
      responses:
        '204': { description: Sesión cerrada. }
        '401': { $ref: '#/components/responses/SinSesion' }
        '503': { $ref: '#/components/responses/BaseNoDisponible' }
  /me:
    get:
      operationId: verPerfilPropio
      summary: Perfil propio (EP-05, O22 y O17)
      security: [{ sesion: [] }]
      responses:
        '200':
          description: Perfil del dueño de la sesión.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Perfil' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '503': { $ref: '#/components/responses/BaseNoDisponible' }
    patch:
      operationId: editarPerfil
      summary: Editar nombre y biografía (EP-06, O3)
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                nombre: { type: string, minLength: 1, maxLength: 100 }
                biografia:
                  type: [string, 'null']
                  maxLength: 500
                  description: Nula o vacía la borra.
      responses:
        '200':
          description: Perfil ya actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Perfil' }
        '400': { $ref: '#/components/responses/EntradaInvalida' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '503': { $ref: '#/components/responses/BaseNoDisponible' }
  /obras:
    get:
      operationId: buscarObras
      summary: Buscar obras por título (EP-08, AP-03)
      description: >-
        Busca palabras completas, sin distinguir mayúsculas ni tildes; basta con que coincida una y
        las obras con más coincidencias van primero. Devuelve como máximo 20, sin paginar. Los
        borradores solo aparecen para el administrador. La búsqueda por persona aún no está disponible.
      security: [{}, { sesion: [] }]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: por
          in: query
          schema: { type: string, enum: [titulo], default: titulo }
      responses:
        '200':
          description: Resultados (puede ser una lista vacía).
          content:
            application/json:
              schema:
                type: object
                required: [obras]
                properties:
                  obras:
                    type: array
                    items: { $ref: '#/components/schemas/ObraBreve' }
        '400': { $ref: '#/components/responses/EntradaInvalida' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '503': { $ref: '#/components/responses/BaseNoDisponible' }
  /obras/{obra_id}:
    get:
      operationId: verFicha
      summary: Ficha de un libro o de una película (EP-09)
      description: >-
        Pública. Con sesión añade `mi_estado` y `mi_resena` (la propia, aunque esté oculta). Un
        borrador solo lo ve el administrador. Si se envía un token que ya no vale, responde 401.
      security: [{}, { sesion: [] }]
      parameters:
        - name: obra_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: La forma depende de `tipo`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/FichaLibro'
                  - $ref: '#/components/schemas/FichaPelicula'
                discriminator:
                  propertyName: tipo
                  mapping:
                    libro: '#/components/schemas/FichaLibro'
                    pelicula: '#/components/schemas/FichaPelicula'
        '400': { $ref: '#/components/responses/EntradaInvalida' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '404':
          description: La obra no existe o es un borrador que quien pide no puede ver.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/BaseNoDisponible' }
components:
  responses:
    EntradaInvalida:
      description: Entrada inválida; `campos` dice qué falla.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SinSesion:
      description: Falta el token, no es válido o la sesión venció.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflicto:
      description: El dato ya existe (por ejemplo, el correo).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BaseNoDisponible:
      description: Una base no responde; se puede reintentar.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  securitySchemes:
    sesion:
      type: http
      scheme: bearer
      description: Token opaco de sesión (D-35).
  schemas:
    Perfil:
      type: object
      required: [usuario_id, correo, nombre, biografia, rol]
      properties:
        usuario_id: { type: string, format: uuid }
        correo: { type: string, format: email }
        nombre: { type: string }
        biografia: { type: [string, 'null'] }
        rol: { type: string, enum: [lector, admin] }
    ObraBreve:
      type: object
      required: [obra_id, tipo, titulo, anio, portada_url]
      properties:
        obra_id: { type: string, format: uuid }
        tipo: { type: string, enum: [libro, pelicula] }
        titulo: { type: string }
        anio: { type: integer }
        portada_url: { type: [string, 'null'] }
    Persona:
      type: object
      required: [persona_id, nombre, foto_url]
      properties:
        persona_id: { type: string, format: uuid }
        nombre: { type: string }
        foto_url: { type: [string, 'null'] }
    MiResena:
      type: object
      required: [resena_id, calificacion, texto, oculta, creado_en, actualizado_en]
      properties:
        resena_id: { type: string, format: uuid }
        calificacion: { type: integer, minimum: 1, maximum: 5 }
        texto: { type: [string, 'null'] }
        oculta: { type: boolean }
        creado_en: { type: string, format: date-time }
        actualizado_en: { type: string, format: date-time }
    FichaComun:
      type: object
      required:
        - obra_id
        - tipo
        - titulo
        - sinopsis
        - portada_url
        - generos
        - estado_publicacion
        - promedio
        - total_resenas
      properties:
        obra_id: { type: string, format: uuid }
        tipo: { type: string, enum: [libro, pelicula] }
        titulo: { type: string }
        sinopsis: { type: string }
        portada_url: { type: [string, 'null'] }
        generos: { type: array, items: { type: string } }
        estado_publicacion: { type: string, enum: [borrador, publicada] }
        promedio: { type: [number, 'null'], description: Nulo si no hay reseñas visibles. }
        total_resenas: { type: integer }
        mi_estado:
          type: [string, 'null']
          enum: [pendiente, en_curso, terminada, null]
          description: Solo con sesión.
        mi_resena:
          description: Solo con sesión.
          oneOf:
            - $ref: '#/components/schemas/MiResena'
            - type: 'null'
    FichaLibro:
      allOf:
        - $ref: '#/components/schemas/FichaComun'
        - type: object
          required: [anio_publicacion_original, ediciones, autores, adaptaciones]
          properties:
            anio_publicacion_original: { type: integer }
            ediciones:
              type: array
              items:
                type: object
                required: [edicion_id, isbn, paginas, editorial, idioma, anio]
                properties:
                  edicion_id: { type: string, format: uuid }
                  isbn: { type: [string, 'null'] }
                  paginas: { type: integer }
                  editorial: { type: string }
                  idioma: { type: string }
                  anio: { type: integer }
            autores: { type: array, items: { $ref: '#/components/schemas/Persona' } }
            adaptaciones: { type: array, items: { $ref: '#/components/schemas/ObraBreve' } }
    FichaPelicula:
      allOf:
        - $ref: '#/components/schemas/FichaComun'
        - type: object
          required:
            [anio_estreno, duracion_min, plataformas, datos_tecnicos, reparto, directores, libro_origen]
          properties:
            anio_estreno: { type: integer }
            duracion_min: { type: integer }
            plataformas:
              type: array
              items:
                type: object
                required: [nombre]
                properties:
                  nombre: { type: string }
            datos_tecnicos:
              type: object
              required: [idioma_original, paises, productoras, clasificacion]
              properties:
                idioma_original: { type: string }
                paises: { type: array, items: { type: string } }
                productoras: { type: array, items: { type: string } }
                clasificacion: { type: [string, 'null'] }
            reparto:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/Persona'
                  - type: object
                    required: [personaje, orden]
                    properties:
                      personaje: { type: string }
                      orden: { type: integer }
            directores: { type: array, items: { $ref: '#/components/schemas/Persona' } }
            libro_origen:
              oneOf:
                - $ref: '#/components/schemas/ObraBreve'
                - type: 'null'
    EstadoBase:
      type: string
      enum: [ok, caida]
    Salud:
      type: object
      required: [estado, api, bases]
      properties:
        estado: { type: string, enum: [ok, degradado] }
        api: { type: string, const: ok }
        bases:
          type: object
          required: [postgres, mongo, neo4j]
          properties:
            postgres: { $ref: '#/components/schemas/EstadoBase' }
            mongo: { $ref: '#/components/schemas/EstadoBase' }
            neo4j: { $ref: '#/components/schemas/EstadoBase' }
    Error:
      type: object
      description: Forma de todos los errores.
      required: [error]
      properties:
        error:
          type: object
          required: [codigo, mensaje]
          properties:
            codigo:
              type: string
              enum:
                - entrada_invalida
                - sin_sesion
                - sin_permiso
                - no_encontrado
                - conflicto
                - demasiado_grande
                - error_interno
                - base_no_disponible
            mensaje: { type: string }
            campos:
              type: object
              additionalProperties: { type: string }
